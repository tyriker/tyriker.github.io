<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 500" width="320" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Dancing cartoon skeleton</title>
  <desc id="desc">A cheerful ivory skeleton with a visible neck dances with one arm raised, a waving hand, and bent legs.</desc>
  <defs>
    <linearGradient id="bone" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#fffdf1"/>
      <stop offset="1" stop-color="#f4e8c8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="165%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#382d3b" flood-opacity=".26"/>
    </filter>
  </defs>

  <g stroke="#382d3b" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- Skull -->
    <path d="M102 70C102 32 127 12 161 12c36 0 59 23 59 58 0 23-8 37-22 47v23h-74v-23c-14-11-22-26-22-47Z" transform="translate(0 26)" fill="url(#bone)" stroke-width="7"/>

    <!-- Spine, shoulders, ribs, and pelvis -->
    <!-- Neck -->
    <path d="M151 166v35m22-35v35" fill="none" stroke-width="7"/>
    <path d="M160 200v123" fill="none" stroke-width="8"/>
    <path d="M160 204 111 218m49-14 50 14" fill="none" stroke-width="7"/>
    <path d="M121 219c-14 13-15 39 6 56m25-61c-16 15-15 50 2 70m15-70c16 15 15 50-2 70m31-65c14 13 15 39-6 56" fill="none" stroke-width="7"/>
    <path d="M130 229h61m-68 19h75m-69 19h63" fill="none" stroke-width="5"/>
    <path d="M127 290c0 28 14 45 34 45s34-17 34-45l-19 9h-30Z" fill="url(#bone)" stroke-width="7"/>
    <path d="M146 302c-1 14 5 22 15 22s16-8 15-22" fill="none" stroke-width="4"/>

    <!-- Raised left arm and hand -->
    <path d="M112 218 76 176 53 130" fill="none" stroke-width="11"/>
    <path d="M54 130 37 97m17 33 4-38m-4 38 29-25" fill="none" stroke-width="7"/>

    <!-- Waving right arm and hand -->
    <path d="M209 219 243 194 266 154" fill="none" stroke-width="11"/>
    <path d="M266 154 278 118m-12 36-13-29m13 29 24-23" fill="none" stroke-width="7"/>

    <!-- Bent legs and feet -->
    <path d="M145 333 116 379 101 432" fill="none" stroke-width="12"/>
    <path d="M102 432 83 461h53" fill="none" stroke-width="12"/>
    <path d="M177 333 204 374 229 419" fill="none" stroke-width="12"/>
    <path d="M229 419 249 449h-53" fill="none" stroke-width="12"/>

  </g>

  <!-- Face details sit above the skull group for crisp, readable expression -->
  <g transform="translate(0 26)" fill="#382d3b">
    <ellipse cx="133" cy="82" rx="15" ry="19"/>
    <ellipse cx="188" cy="82" rx="15" ry="19"/>
    <path d="M160 97c-8 9-8 16 0 16s8-7 0-16Z"/>
    <ellipse cx="160" cy="128" rx="23" ry="15"/>
  </g>
</svg>
